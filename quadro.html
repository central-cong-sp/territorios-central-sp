<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quadro de Anuncios - Congregacao Central SP 40600</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#222;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
header{background:#1565c0;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;}
header h1{font-size:1.05rem;flex:1;}
header a{color:rgba(255,255,255,.8);font-size:.8rem;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:5px;}
.tabs{background:#1976d2;display:flex;gap:0;flex-shrink:0;}
.tab{background:none;border:none;color:rgba(255,255,255,.7);padding:9px 18px;cursor:pointer;font-size:.85rem;border-bottom:3px solid transparent;transition:all .15s;}
.tab.on,.tab:hover{color:#fff;border-bottom-color:#90caf9;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
#vistaDir{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#vistaDir iframe{width:100%;flex:1;border:none;display:block;}
#vistaPDF{flex:1;overflow:hidden;display:none;flex-direction:column;}
.pdf-toolbar{background:#37474f;color:#fff;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.pdf-toolbar span{flex:1;font-size:.87rem;}
.pdf-toolbar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:.82rem;}
#vistaPDF iframe{flex:1;border:none;}
#vistaLista{flex:1;overflow-y:auto;display:none;}
.lista-inner{padding:16px;}
.av{background:#fff9c4;border-left:4px solid #f9a825;padding:10px 14px;border-radius:5px;font-size:.84rem;margin-bottom:14px;}
.form-add{background:#fff;border-radius:8px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.09);}
.form-add h3{font-size:.95rem;color:#1565c0;margin-bottom:10px;}
.form-add p{font-size:.81rem;color:#666;margin-bottom:10px;line-height:1.5;}
.form-add input{width:100%;border:1px solid #ddd;border-radius:6px;padding:7px 10px;font-size:.85rem;margin-bottom:7px;}
.row-btns{display:flex;gap:8px;margin-top:4px;}
.row-btns button{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:.84rem;}
.bp{background:#1565c0;color:#fff;}.bp:hover{background:#0d47a1;}
.bs{background:#eee;color:#444;}.bs:hover{background:#ddd;}
.lista-pdfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.pdf-item{background:#fff;border:1px solid #ddd;border-radius:7px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;}
.pdf-item:hover,.pdf-item.sel{border-color:#1565c0;background:#e3f2fd;}
.pdf-item .ico{font-size:1.6rem;flex-shrink:0;}
.pdf-item .nm{font-size:.84rem;font-weight:500;}
.pdf-item .sub{font-size:.72rem;color:#888;margin-top:2px;}
.pdf-item .del{margin-left:auto;color:#ccc;cursor:pointer;font-size:1rem;padding:2px 5px;flex-shrink:0;}
.pdf-item .del:hover{color:#e53935;}
.nav-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.nav-bar button{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:.83rem;background:#1565c0;color:#fff;}
.nav-bar button:disabled{background:#ccc;cursor:not-allowed;}
.nav-bar span{font-size:.82rem;color:#555;}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b5e20;color:#fff;padding:9px 20px;border-radius:8px;font-size:.86rem;display:none;z-index:9999;}
#toast.err{background:#c62828;}
</style>
</head>
<body>
<header>
  <h1>&#128227; Quadro de Anuncios &#8212; Congregacao Central SP 40600</h1>
  <a href="index.html">&#8592; Territorios</a>
</header>
<div class="tabs">
  <button class="tab on" id="tabDir" onclick="verTab('dir')">&#128193; Pasta do Drive</button>
  <button class="tab" id="tabLista" onclick="verTab('lista')">&#128196; PDFs Individuais</button>
</div>
<div class="content">
  <div id="vistaDir">
    <iframe src="https://drive.google.com/embeddedfolderview?id=1zD2VKrtNAVM2Z-Zlpmuw4d7kq9QD05Z9#list"
      title="Pasta Quadro de Anuncios"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
    ></iframe>
  </div>
  <div id="vistaPDF">
    <div class="pdf-toolbar">
      <button onclick="fecharPDF()">&#8592; Voltar</button>
      <button id="bPrev" onclick="navPDF(-1)" disabled>&#8592; Anterior</button>
      <span id="titAtual">&#8212;</span>
      <button id="bNext" onclick="navPDF(1)" disabled>Proximo &#8594;</button>
      <span id="contPDF"></span>
    </div>
    <iframe id="iframePDF" src="" allow="autoplay" allowfullscreen style="flex:1;border:none;"></iframe>
  </div>
  <div id="vistaLista">
    <div class="lista-inner">
      <div class="av">
        Cole o link de compartilhamento de um PDF do Google Drive. O ID e extraido automaticamente.
        A lista fica salva neste navegador.
      </div>
      <div class="form-add" id="formAdd">
        <h3>&#43; Adicionar PDF</h3>
        <p>Botao direito no arquivo no Drive > Compartilhar > Copiar link</p>
        <input type="text" id="inpNome" placeholder="Nome do documento (ex: Folha de Reuniao 29/06)">
        <input type="text" id="inpLink" placeholder="Link do Google Drive...">
        <div class="row-btns">
          <button class="bp" id="btnAdd">&#43; Adicionar</button>
          <button class="bs" id="btnCancelar">Cancelar</button>
        </div>
      </div>
      <div id="navBar" class="nav-bar" style="display:none">
        <button id="bPrev2" disabled onclick="navPDF(-1)">&#8592;</button>
        <span id="contPDF2"></span>
        <button id="bNext2" disabled onclick="navPDF(1)">&#8594;</button>
        <button class="bs" style="margin-left:auto" onclick="mostrarForm()">&#43; Adicionar PDF</button>
      </div>
      <div class="lista-pdfs" id="listaPDFs"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
var PDFS = [];
var idx = -1;
var tabAtual = 'dir';

function verTab(t) {
  tabAtual = t;
  document.getElementById('tabDir').classList.toggle('on', t === 'dir');
  document.getElementById('tabLista').classList.toggle('on', t === 'lista');
  document.getElementById('vistaDir').style.display = t === 'dir' ? 'flex' : 'none';
  document.getElementById('vistaPDF').style.display = 'none';
  document.getElementById('vistaLista').style.display = t === 'lista' ? 'block' : 'none';
  if (t === 'lista') renderLista();
}

// Inicializar display
document.getElementById('vistaDir').style.display = 'flex';
document.getElementById('vistaLista').style.display = 'none';
document.getElementById('vistaPDF').style.display = 'none';

function load() {
  try { PDFS = JSON.parse(localStorage.getItem('qa_pdfs') || '[]'); } catch(e) { PDFS = []; }
}
function save() { localStorage.setItem('qa_pdfs', JSON.stringify(PDFS)); }

function toast(m, e) {
  var t = document.getElementById('toast');
  t.textContent = m; t.className = e ? 'err' : ''; t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3500);
}

// Botao Adicionar — usando addEventListener para evitar problema de escopo
document.getElementById('btnAdd').addEventListener('click', function() {
  var nome = document.getElementById('inpNome').value.trim();
  var link = document.getElementById('inpLink').value.trim();
  if (!nome) { toast('Informe o nome do documento.', true); return; }
  if (!link) { toast('Cole o link do Google Drive.', true); return; }
  var m = link.match(//d/([a-zA-Z0-9_-]{20,})/);
  if (!m) { toast('Link invalido. Use o link de compartilhamento (contendo /d/...)', true); return; }
  load();
  PDFS.push({ nome: nome, id: m[1] });
  save();
  document.getElementById('inpNome').value = '';
  document.getElementById('inpLink').value = '';
  renderLista();
  abrirPDF(PDFS.length - 1);
  toast('PDF adicionado!');
});

document.getElementById('btnCancelar').addEventListener('click', function() {
  document.getElementById('formAdd').style.display = 'none';
});

function mostrarForm() {
  document.getElementById('formAdd').style.display = 'block';
}

function renderLista() {
  load();
  var el = document.getElementById('listaPDFs');
  var nav = document.getElementById('navBar');
  if (PDFS.length === 0) {
    el.innerHTML = '<p style="color:#aaa;font-size:.84rem">Nenhum PDF adicionado. Use o formulario acima.</p>';
    nav.style.display = 'none';
    return;
  }
  nav.style.display = 'flex';
  atualizarNav();
  el.innerHTML = PDFS.map(function(p, i) {
    return '<div class="pdf-item' + (i === idx ? ' sel' : '') + '" onclick="abrirPDF(' + i + ')">' +
      '<span class="ico">&#128196;</span>' +
      '<div><div class="nm">' + p.nome + '</div><div class="sub">Google Drive PDF</div></div>' +
      '<span class="del" onclick="event.stopPropagation();delPDF(' + i + ')">&#10005;</span>' +
      '</div>';
  }).join('');
}

function delPDF(i) {
  if (!confirm('Remover este PDF?')) return;
  load(); PDFS.splice(i, 1); save();
  if (i === idx) fecharPDF();
  renderLista();
}

function abrirPDF(i) {
  if (i < 0 || i >= PDFS.length) return;
  idx = i;
  document.getElementById('iframePDF').src = 'https://drive.google.com/file/d/' + PDFS[i].id + '/preview';
  document.getElementById('titAtual').textContent = PDFS[i].nome;
  document.getElementById('contPDF').textContent = (i + 1) + '/' + PDFS.length;
  document.getElementById('contPDF2').textContent = (i + 1) + ' de ' + PDFS.length;
  document.getElementById('vistaLista').style.display = 'none';
  document.getElementById('vistaPDF').style.display = 'flex';
  document.getElementById('vistaDir').style.display = 'none';
  atualizarNav();
}

function fecharPDF() {
  document.getElementById('vistaPDF').style.display = 'none';
  if (tabAtual === 'lista') {
    document.getElementById('vistaLista').style.display = 'block';
    renderLista();
  } else {
    document.getElementById('vistaDir').style.display = 'flex';
  }
}

function navPDF(dir) {
  load();
  var novo = idx + dir;
  if (novo >= 0 && novo < PDFS.length) abrirPDF(novo);
}

function atualizarNav() {
  var pd = idx <= 0; var pn = PDFS.length === 0 || idx >= PDFS.length - 1;
  var bp = document.getElementById('bPrev'); if(bp) bp.disabled = pd;
  var bn = document.getElementById('bNext'); if(bn) bn.disabled = pn;
  var b2 = document.getElementById('bPrev2'); if(b2) b2.disabled = pd;
  var b3 = document.getElementById('bNext2'); if(b3) b3.disabled = pn;
}

load();
</script>
</body>
</html>
